extends: [.config/lefthook/plain-output.yml]

pre-commit:
  commands:
    public-policy:
      glob: "*"
      run: ./bin/check-public-candidate.sh --staged
    skill-safety:
      glob: "*"
      run: ./bin/check-skill-safety.sh
    trufflehog:
      glob: "*"
      run: trufflehog filesystem {staged_files} --results=verified,unknown --exclude-detectors=Lob --fail --no-update --no-color
