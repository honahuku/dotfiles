apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: .agents/skills/yomiyasu
    contents:
      - path: .
        git:
          url: https://github.com/nanaism/yomiyasu.git
          ref: v1.0.4
          depth: 1
          subPath: skills/yomiyasu
        includePaths:
          - skills/yomiyasu/SKILL.md
          - skills/yomiyasu/references/**/*
          - skills/yomiyasu/scripts/yomiyasu_diff.py
          - skills/yomiyasu/scripts/yomiyasu_lint.py
        newRootPath: skills/yomiyasu
  - path: .agents/skills/grill-me
    contents:
      - path: .
        git:
          url: https://github.com/mattpocock/skills.git
          ref: main
          depth: 1
        includePaths:
          - skills/productivity/grill-me/SKILL.md
        newRootPath: skills/productivity/grill-me
  - path: .agents/skills/grilling
    contents:
      - path: .
        git:
          url: https://github.com/mattpocock/skills.git
          ref: main
          depth: 1
        includePaths:
          - skills/productivity/grilling/SKILL.md
        newRootPath: skills/productivity/grilling
