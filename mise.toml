min_version = "2026.10.17"

[vars]
public_root = "{{ env.DOTFILES_PUBLIC_ROOT | default(value=config_root) }}"
windows_state = "{{ env.HOME }}/.local/share/dotfiles/windows"
powershell = "{{ env.DOTFILES_POWERSHELL | default(value='/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe') }}"
chezmoi = "aqua -c {{ vars.public_root | quote }}/aqua.yaml exec -- chezmoi --config {{ vars.windows_state | quote }}/chezmoi.toml --source {{ vars.windows_state | quote }}/source --persistent-state {{ vars.windows_state | quote }}/state.boltdb --cache {{ vars.windows_state | quote }}/cache --no-pager --refresh-externals=always"

[task_config]
includes = ["{{ vars.public_root }}/mise-tasks.toml"]

[bootstrap.hooks]
post-dotfiles = "mise run windows:apply"

[dotfiles]
"~/.local/share/dotfiles/windows/source/.agents.md" = { source = ".agents/AGENTS.md", mode = "copy" }
"~/.local/share/dotfiles/windows/source/.terminal.json" = { source = "win/terminal/settings.json", mode = "copy" }
"~/.local/share/dotfiles/windows/source/.config.toml.tmpl" = { source = "win/chezmoi/.config.toml.tmpl", mode = "copy" }
"~/.local/share/dotfiles/windows/source/.chezmoiexternal.toml" = { source = "win/chezmoi/.chezmoiexternal.toml", mode = "copy" }
"~/.bashrc/dotfiles-shell" = { block = '''
if [ -n "${BASH_VERSION:-}" ]; then
  . "$HOME/git/honahuku/dotfiles/shell/bashrc.sh"
fi
''' }
"~/.profile/dotfiles-shell" = { block = '''
. "$HOME/git/honahuku/dotfiles/shell/profile.sh"
if [ -n "${BASH_VERSION:-}" ] && [ -z "${DOTFILES_SHELL_LOADED:-}" ]; then
  . "$HOME/.bashrc"
fi
''' }
"~/.config/mise/config.toml" = ".config/mise/config.toml"
"~/.config/lazygit/config.yml" = ".config/lazygit/config.yml"
"~/aqua.yaml" = "aqua.yaml"
"~/.config/nvim" = "nvim"
"~/.codex/AGENTS.md" = ".agents/AGENTS.md"

[dotfile_groups.public-skills]
root = "~/git/honahuku/dotfiles/.agents/skills"
target = "~/.agents/skills"
mode = "symlink-each"
exclude = ["__pycache__", "*.pyc"]
