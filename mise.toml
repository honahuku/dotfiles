min_version = "2026.10.17"

[task_config]
includes = ["mise-tasks.toml"]

[dotfiles]
"~/.local/share/dotfiles/agents/skills" = "agents/skills"
"~/.agents/skills" = ".agents/skills"
"~/.codex/AGENTS.md" = "agents/AGENTS.md"
"~/.config/opencode/AGENTS.md" = "agents/AGENTS.md"
"~/.config/mise/config.toml" = ".config/mise/config.toml"
"~/.config/lazygit/config.yml" = ".config/lazygit/config.yml"
"~/.config/opencode/opencode.jsonc" = ".config/opencode/opencode.jsonc"
"~/.lefthook-global.yml" = ".config/lefthook/global.yml"
"~/aqua.yaml" = "aqua.yaml"
"~/.config/nvim" = "nvim"

[dotfile_groups.public-agent-hooks]
root = "~/git/honahuku/dotfiles/agents/hooks"
target = "~/.agents/hooks"
mode = "symlink-each"

[dotfile_groups.public-agent-prh]
root = "~/git/honahuku/dotfiles/agents/prh"
target = "~/.agents/prh"
mode = "symlink-each"
