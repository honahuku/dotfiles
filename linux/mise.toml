[dotfiles]
"~/.local/bin/tasks" = "../bin/tasks"
"~/.bashrc/dotfiles-profile" = { line = '. "$HOME/git/honahuku/dotfiles/linux/profile.sh"', position = "prepend" }
"~/.bashrc/dotfiles-shell" = { block = '''
if [ -n "${BASH_VERSION:-}" ]; then
  . "$HOME/git/honahuku/dotfiles/linux/bashrc.sh"
fi
''' }
"~/.config/systemd/user/cloudflared-tunnel.service" = "systemd/user/cloudflared-tunnel.service"
